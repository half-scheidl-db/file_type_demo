bundle:
  name: file-type-demo
  engine: direct

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for the demo.
    default: multimodal_demo
  schema:
    description: Unity Catalog schema for the demo.
    default: manufacturing
  volume:
    description: Unity Catalog volume used as the external inspection-system drop zone.
    default: inspection_dropzone
  warehouse_id:
    description: Existing SQL warehouse ID used by the Databricks App.
  model_endpoint:
    description: Multimodal Databricks model endpoint used by ai_query.
    default: system.ai.llama-4-maverick

resources:
  catalogs:
    demo_catalog:
      name: ${var.catalog}
      comment: Catalog for the FILE-type visual inspection demo.
      lifecycle:
        prevent_destroy: true

  schemas:
    demo_schema:
      name: ${var.schema}
      catalog_name: ${resources.catalogs.demo_catalog.name}
      comment: Schema for pharmaceutical manufacturing visual inspection demo assets.
      lifecycle:
        prevent_destroy: true

  volumes:
    inspection_dropzone:
      name: ${var.volume}
      catalog_name: ${resources.catalogs.demo_catalog.name}
      schema_name: ${resources.schemas.demo_schema.name}
      volume_type: MANAGED
      comment: External-system drop zone for synthetic manufacturing inspection images.
      lifecycle:
        prevent_destroy: true

targets:
  dev:
    mode: development
    default: true
